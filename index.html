<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuxFatum 裁定對決 v4.2.2 桌面連線版</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090d;
      --panel: #12141c;
      --panel2: #1b1d28;
      --line: #343947;
      --text: #f3f0e8;
      --muted: #b7b1a2;
      --blue: #5aa7ff;
      --red: #ff6c7a;
      --green: #7ddc9a;
      --gold: #e6c06a;
      --gold2: #fff0b8;
      --ink: rgba(4,5,8,.84);
      --violet: #b798ff;
      --glass: rgba(18, 20, 29, .78);
      --glow-blue: rgba(90,167,255,.28);
      --glow-red: rgba(255,108,122,.28);
      --glow-gold: rgba(255,209,102,.34);
      --soft-line: rgba(230,192,106,.16);
      --title-font: "Noto Serif TC", "Microsoft JhengHei UI", "Microsoft JhengHei", serif;
      --body-font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei UI", "Microsoft JhengHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--body-font);
      line-height: 1.55;
      background:
        linear-gradient(180deg, rgba(8,9,13,.36), rgba(8,9,13,.9) 46%, #07080b 100%),
        url("assets/luxfatum-arena-bg.png") center top / cover fixed no-repeat,
        var(--bg);
      color: var(--text);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(90,167,255,.12), transparent 38%),
        linear-gradient(235deg, rgba(255,108,122,.12), transparent 42%),
        linear-gradient(180deg, rgba(255,209,102,.06), transparent 34%);
      mix-blend-mode: screen;
      z-index: -1;
    }
    h1, h2, h3, p, li, button, span { overflow-wrap: anywhere; }
    h1, h2, h3 { line-height: 1.2; letter-spacing: 0; }
    button, input, select { font: inherit; }
    button {
      border: 1px solid rgba(230,192,106,.22);
      background: linear-gradient(180deg, rgba(44,43,36,.94), rgba(17,18,24,.94));
      color: var(--text);
      border-radius: 8px;
      padding: 11px 14px;
      min-height: 44px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px rgba(0,0,0,.22);
      transition: transform .14s ease, border-color .14s ease, filter .14s ease, box-shadow .14s ease;
    }
    button:hover:not(:disabled) { border-color: var(--gold2); filter: brightness(1.12); transform: translateY(-1px); box-shadow: 0 0 18px rgba(230,192,106,.18), 0 12px 26px rgba(0,0,0,.28); }
    button:active:not(:disabled) { transform: translateY(1px) scale(.99); }
    button:disabled { opacity: .42; cursor: not-allowed; }
    input, select { background: rgba(7,9,14,.86); color: var(--text); border: 1px solid rgba(230,192,106,.22); border-radius: 8px; padding: 10px; width: 100%; }
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .app.shake { animation: screenShake .22s ease; }
    .top { position: sticky; top: 0; z-index: 6; min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 24px; border-bottom: 1px solid rgba(230,192,106,.12); background: rgba(7,8,12,.9); backdrop-filter: blur(16px); box-shadow: 0 18px 34px rgba(0,0,0,.34); }
    .brand h1 { margin: 0; font-family: var(--title-font); font-size: 24px; letter-spacing: 0; text-shadow: 0 0 16px rgba(255,209,102,.22); }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
    .top-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .wrap { width: min(1480px, 100%); margin: 0 auto; padding: 28px; }
    .grid { display: grid; gap: 22px; }
    .menu { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); align-items: stretch; margin-top: 26px; }
    .menu-shell { padding-top: 26px; }
    .game-hero { min-height: 320px; display: flex; align-items: end; padding: 40px; border: 1px solid rgba(230,192,106,.16); border-radius: 8px; background: linear-gradient(180deg, rgba(5,7,12,.06), rgba(5,7,12,.64)), url("assets/luxfatum-arena-bg.png") center / cover no-repeat; box-shadow: 0 24px 70px rgba(0,0,0,.42); overflow: hidden; }
    .game-hero h2 { margin: 0; font-family: var(--title-font); font-size: clamp(38px, 6vw, 72px); line-height: 1; letter-spacing: 0; text-shadow: 0 0 22px rgba(255,209,102,.32), 0 4px 18px rgba(0,0,0,.66); }
    .game-hero p { max-width: 680px; color: #dce4f5; margin: 14px 0 0; line-height: 1.8; font-size: 15px; }
    .character-ribbon { display: grid; grid-template-columns: repeat(6, 1fr); gap: 24px; margin-top: 26px; padding: 2px 0; }
    .ribbon-card { min-height: 0; aspect-ratio: 3 / 4; border: 0; border-radius: 8px; background-size: cover; background-repeat: no-repeat; background-position: var(--focus, center 16%); box-shadow: 0 18px 42px rgba(0,0,0,.38), inset 0 0 0 1px rgba(230,192,106,.18); position: relative; overflow: hidden; }
    .ribbon-card::after { content: ""; position: absolute; inset: auto 0 0; height: 52%; background: linear-gradient(180deg, transparent, rgba(5,7,12,.86)); }
    .ribbon-card span { position: absolute; left: 12px; bottom: 10px; z-index: 1; font-weight: 800; text-shadow: 0 2px 12px #000; }
    .card, .fighter, .log, .actions, .draft-card { background: linear-gradient(180deg, rgba(22,23,28,.84), rgba(8,9,13,.86)); border: 1px solid var(--soft-line); border-radius: 8px; backdrop-filter: blur(10px); box-shadow: 0 16px 40px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,240,184,.06); }
    .card { padding: 24px; }
    .card h2 { margin: 0 0 12px; font-family: var(--title-font); }
    .card p { color: var(--muted); line-height: 1.85; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .pill { display: inline-flex; align-items: center; gap: 4px; border: 1px solid rgba(230,192,106,.18); background: rgba(8,9,13,.72); padding: 4px 9px; border-radius: 999px; font-size: 12px; color: var(--muted); line-height: 1.25; }
    .pill.gold, .accent { color: var(--gold); border-color: rgba(255,209,102,.32); background: rgba(255,209,102,.08); }
    .pill.blue { color: #9fd0ff; border-color: rgba(90,167,255,.34); background: rgba(90,167,255,.09); }
    .pill.red { color: #ff9aa6; border-color: rgba(255,108,122,.34); background: rgba(255,108,122,.09); }
    .pill.good { color: var(--green); border-color: rgba(125,220,154,.34); background: rgba(125,220,154,.08); }
    .pill.bad { color: var(--red); border-color: rgba(255,108,122,.34); background: rgba(255,108,122,.08); }
    .pill.queue-current { color: var(--gold2); border-color: rgba(230,192,106,.48); background: rgba(230,192,106,.12); box-shadow: 0 0 16px rgba(230,192,106,.16); }
    .status-pill { font-weight: 800; color: #f7ead0; }
    .status-icon { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: rgba(230,192,106,.14); color: var(--gold2); font-size: 11px; }
    .hi-blue { color: #9fd0ff; font-weight: 800; }
    .hi-red { color: #ff91a0; font-weight: 800; }
    .hi-gold { color: var(--gold); font-weight: 800; }
    .subtle { color: var(--muted); font-size: 13px; }
    .p1 { color: var(--blue); }
    .p2 { color: var(--red); }
    .battle-table { display: grid; gap: 18px; align-items: start; }
    .battle-core { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(360px, 470px); grid-template-areas: "stage command"; gap: 18px; align-items: start; padding: 18px; border: 1px solid rgba(230,192,106,.16); border-radius: 8px; background: linear-gradient(180deg, rgba(8,9,13,.46), rgba(5,6,9,.3)); box-shadow: inset 0 0 80px rgba(230,192,106,.035), 0 18px 45px rgba(0,0,0,.26); }
    .core-stage { grid-area: stage; display: grid; gap: 16px; }
    .core-command { grid-area: command; display: grid; gap: 16px; position: sticky; top: 94px; }
    .core-log { grid-area: log; display: grid; grid-template-columns: minmax(320px, .78fr) minmax(360px, 1fr); gap: 16px; align-items: start; }
    .combat-drawer { position: fixed; left: 18px; top: 92px; z-index: 7; width: min(326px, calc(100vw - 32px)); pointer-events: none; }
    .combat-drawer-panel { pointer-events: auto; display: grid; gap: 10px; max-height: calc(100vh - 112px); overflow: hidden; padding: 12px; border: 1px solid rgba(230,192,106,.24); border-radius: 8px; background: linear-gradient(180deg, rgba(18,18,18,.94), rgba(7,8,12,.94)); box-shadow: 0 22px 64px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,240,184,.08); backdrop-filter: blur(16px); transform: translateX(0); opacity: 1; transition: transform .22s ease, opacity .22s ease; }
    .combat-drawer:not(.open) .combat-drawer-panel { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }
    .combat-drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 2px; }
    .combat-drawer-head h2 { margin: 7px 0 0; font-family: var(--title-font); font-size: 18px; }
    .combat-drawer-close { width: 40px; min-height: 40px; padding: 0; font-weight: 900; }
    .combat-drawer .queue-card, .combat-drawer .log { padding: 14px; box-shadow: none; }
    .combat-drawer .queue-card h2, .combat-drawer .log h2 { font-size: 15px; margin-bottom: 10px; }
    .combat-drawer .queue-card .row { display: grid; gap: 8px; }
    .combat-drawer .queue-card .pill { width: 100%; justify-content: space-between; border-radius: 8px; padding: 8px 10px; }
    .combat-drawer .log { max-height: min(42vh, 360px); }
    .combat-drawer .log-line { padding: 8px 0 9px; font-size: 12.5px; line-height: 1.62; }
    .team { display: grid; gap: 12px; padding: 14px; border: 1px solid rgba(230,192,106,.12); border-radius: 8px; background: rgba(5,7,12,.34); }
    .team.p1-side { box-shadow: inset 0 -3px 0 rgba(90,167,255,.75), 0 0 30px rgba(90,167,255,.06); }
    .team.p2-side { box-shadow: inset 0 3px 0 rgba(255,108,122,.75), 0 0 30px rgba(255,108,122,.06); }
    .team-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 0; }
    .team-head h2 { margin: 0; font-family: var(--title-font); }
    .team-roster { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 12px; align-items: stretch; }
    .fighter { padding: 14px; position: relative; overflow: visible; min-height: 0; }
    .fighter::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(230,192,106,.12), transparent 34%); pointer-events: none; opacity: .56; border-radius: inherit; }
    .fighter.active { outline: 2px solid rgba(255,209,102,.72); outline-offset: 3px; box-shadow: 0 0 0 1px rgba(255,209,102,.2), 0 0 32px rgba(255,209,102,.18); }
    .fighter.dead { opacity: .45; }
    .fighter.hit { animation: hitFlash .5s ease; }
    .fighter-main { display: grid; grid-template-columns: minmax(78px, 96px) minmax(0, 1fr); gap: 12px; align-items: start; position: relative; z-index: 1; }
    .fighter-art { width: 100%; aspect-ratio: 3 / 4; border-radius: 7px; object-fit: cover; object-position: var(--focus, center 16%); border: 0; box-shadow: 0 14px 30px rgba(0,0,0,.42), inset 0 0 0 1px rgba(230,192,106,.2); background: transparent; }
    .fighter-info { min-width: 0; }
    .fighter h3 { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 8px; align-items: start; }
    .fighter-name { min-width: 0; font-family: var(--title-font); }
    .hpbar { height: 12px; background: #08090c; border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,255,255,.16); box-shadow: inset 0 1px 4px rgba(0,0,0,.8); }
    .hpfill { height: 100%; background: linear-gradient(90deg, #48e08a, #f2d066 62%, #ff6675); box-shadow: 0 0 14px rgba(125,220,154,.38); }
    .stats, .statuses { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .desc { color: var(--muted); font-size: 13px; line-height: 1.72; margin: 11px 0 0; }
    .fighter .desc { overflow: visible; }
    .fighter-text { display: grid; gap: 6px; margin-top: 12px; }
    .fighter-text .desc { margin: 0; }
    .record-board { position: relative; z-index: 1; display: grid; gap: 6px; margin-top: 10px; padding: 8px; border: 1px solid rgba(230,192,106,.14); border-radius: 8px; background: rgba(5,6,9,.34); }
    .record-row { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; align-items: start; }
    .record-label { color: var(--gold2); font-size: 12px; font-weight: 900; }
    .record-row p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.48; overflow-wrap: break-word; word-break: normal; }
    .center { display: grid; gap: 22px; }
    .active-spotlight { min-height: 270px; overflow: hidden; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, 34%); align-items: end; gap: 18px; padding: 24px; border: 1px solid rgba(230,192,106,.18); border-radius: 8px; background: linear-gradient(130deg, rgba(20,19,16,.94), rgba(7,9,14,.86)); box-shadow: 0 18px 42px rgba(0,0,0,.4); }
    .active-spotlight::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,7,12,.08), rgba(5,7,12,.82)); }
    .active-spotlight > div { position: relative; z-index: 1; min-width: 0; }
    .spotlight-frame { position: relative; z-index: 1; min-height: 0; align-self: stretch; overflow: hidden; border-radius: 8px; background: #08090d; box-shadow: 0 18px 32px rgba(0,0,0,.42), inset 0 0 0 1px rgba(230,192,106,.22); }
    .spotlight-frame::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 10%, rgba(255,240,184,.16), transparent 40%); pointer-events: none; z-index: 2; mix-blend-mode: screen; }
    .spotlight-frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,7,12,.02), transparent 58%, rgba(5,7,12,.24)); pointer-events: none; z-index: 2; }
    .spotlight-art { position: relative; z-index: 1; display: block; width: 100%; height: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: var(--focus, center 16%); border-radius: 8px; filter: drop-shadow(0 18px 28px rgba(0,0,0,.45)); }
    .active-spotlight h2 { margin: 6px 0 8px; font-family: var(--title-font); font-size: 28px; text-shadow: 0 2px 14px #000; }
    .active-spotlight p { margin: 10px 0 0; color: #dce4f5; line-height: 1.75; font-size: 14px; }
    .spotlight-res { color: #b8c4d8; }
    .turn-hud { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    .skill-burst { position: relative; overflow: hidden; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px 18px; border: 1px solid rgba(230,192,106,.3); border-radius: 8px; background: linear-gradient(100deg, rgba(230,192,106,.16), rgba(9,10,14,.9) 46%, rgba(90,167,255,.1)); box-shadow: 0 16px 36px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,240,184,.14); animation: skillBurst .7s ease both; }
    .skill-burst::after { content: ""; position: absolute; inset: 0; transform: translateX(-120%); background: linear-gradient(90deg, transparent, rgba(255,240,184,.34), transparent); animation: skillSweep .9s ease both; }
    .fx-rune { position: relative; z-index: 1; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,240,184,.36); background: radial-gradient(circle, rgba(255,240,184,.22), rgba(230,192,106,.08) 56%, rgba(5,6,9,.82)); color: var(--gold2); font-family: var(--title-font); font-size: 22px; font-weight: 900; box-shadow: 0 0 24px rgba(230,192,106,.18); }
    .fx-copy { position: relative; z-index: 1; min-width: 0; }
    .skill-burst strong { position: relative; z-index: 1; display: block; color: var(--gold2); font-family: var(--title-font); font-size: 18px; }
    .skill-burst .fx-copy span { position: relative; z-index: 1; display: block; margin-top: 3px; color: #e6dfce; font-size: 13px; }
    .status-help { display: grid; gap: 8px; margin: 0 0 16px; }
    .status-help-row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 11px; border: 1px solid rgba(230,192,106,.16); border-radius: 8px; background: rgba(5,6,9,.32); color: #dcd3bf; font-size: 12.5px; line-height: 1.55; }
    .status-help-row b { color: var(--gold2); }
    .actions { padding: 20px; }
    .actions h2 { margin: 0 0 14px; font-size: 19px; font-family: var(--title-font); }
    .action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .actions .action-grid button { min-height: 74px; font-weight: 800; letter-spacing: 0; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; text-align: left; gap: 4px; }
    .actions .action-grid button:not(:disabled):has(.command-label) { background: linear-gradient(180deg, rgba(50,47,35,.95), rgba(16,17,22,.95)); }
    .actions .action-grid button:not(:disabled):has(.command-label):hover { box-shadow: 0 0 22px rgba(230,192,106,.18), 0 14px 26px rgba(0,0,0,.34); }
    .action-grid .judgement-action { grid-column: 1 / -1; }
    .command-label { display: block; color: #f6f1dc; font-size: 16px; }
    .command-note { display: block; color: var(--muted); font-size: 12px; font-weight: 650; line-height: 1.35; }
    .quick-tip { margin: 0 0 16px; padding: 12px 14px; border: 1px solid rgba(255,209,102,.18); border-radius: 8px; background: linear-gradient(90deg, rgba(255,209,102,.08), rgba(90,167,255,.06)); color: #dce4f5; line-height: 1.75; font-size: 13px; }
    .log { padding: 18px; max-height: 460px; overflow: auto; scroll-padding: 14px; }
    .log h2 { margin: 0 0 8px; font-size: 16px; }
    .log-line { color: #d9deea; border-bottom: 1px solid rgba(255,255,255,.06); padding: 10px 0 11px; font-size: 13px; line-height: 1.72; min-height: 0; }
    .log-line.impact { color: var(--gold); animation: logPop .28s ease; }
    .draft { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); grid-auto-rows: auto; gap: 24px; padding-top: 8px; align-items: stretch; }
    .draft-card { padding: 0; text-align: left; min-height: 0; height: auto; overflow: hidden; display: grid; grid-template-rows: auto 1fr; border: 1px solid rgba(230,192,106,.16); background: linear-gradient(180deg, rgba(32,28,18,.72), rgba(10,11,15,.86)); }
    .draft-card h3 { margin: 0; font-family: var(--title-font); font-size: 25px; text-shadow: 0 2px 12px rgba(0,0,0,.74); }
    .draft-art { min-height: 0; aspect-ratio: 3 / 4; background-size: cover; background-repeat: no-repeat; background-position: var(--focus, center 16%); position: relative; display: flex; align-items: end; padding: 18px; background-color: transparent; }
    .draft-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 24%, rgba(5,7,12,.78)); pointer-events: none; }
    .draft-art h3 { position: relative; z-index: 1; }
    .draft-body { padding: 18px; display: grid; align-content: start; gap: 12px; min-height: 0; }
    .draft-body .desc { overflow: visible; }
    .draft-card:hover:not(:disabled) { box-shadow: 0 0 24px rgba(255,209,102,.16), 0 16px 34px rgba(0,0,0,.28); }
    .draft-card.selected { opacity: .45; filter: grayscale(.35); }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: grid; place-items: center; padding: 16px; z-index: 10; }
    .dialog { width: min(960px, 100%); max-height: 88vh; overflow: auto; background: linear-gradient(180deg, rgba(26,30,43,.96), rgba(12,15,23,.96)); border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 26px; box-shadow: 0 26px 90px rgba(0,0,0,.58); }
    .dialog h2 { margin: 0; font-size: 28px; }
    .dialog-head { align-items: center; justify-content: space-between; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.1); }
    .dialog-body { display: grid; gap: 18px; }
    .dialog-section { padding: 20px; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; background: rgba(8,11,18,.52); }
    .dialog-section h3 { margin: 0 0 14px; font-size: 15px; color: var(--gold); letter-spacing: 0; }
    .skill-meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .resonance-box { display: grid; gap: 12px; }
    .resonance-box label { gap: 12px; align-items: center; font-size: 18px; }
    .skill-desc { font-size: 15px; line-height: 1.75; color: #dce4f5; }
    .choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
    .choice { text-align: left; min-width: 0; overflow-wrap: anywhere; padding: 16px 18px; min-height: 84px; }
    .choice-title { display: block; font-size: 18px; margin-bottom: 8px; }
    .choice input { width: auto; margin-right: 6px; }
    .online { display: grid; gap: 10px; padding: 12px; background: #11141b; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; }
    .pending { border-color: var(--gold); background: #211c12; }
    .danger-zone { border: 1px solid rgba(255,108,122,.18); border-radius: 8px; padding: 12px 14px; background: rgba(20,12,16,.56); color: var(--muted); }
    .danger-zone summary { cursor: pointer; font-weight: 800; color: #ff9aa6; }
    .danger-zone .action-grid { margin-top: 12px; }
    .room-banner { display: grid; gap: 10px; background: linear-gradient(90deg, rgba(18,28,44,.86), rgba(34,25,40,.82)); border: 1px solid rgba(255,209,102,.24); border-radius: 8px; padding: 14px; margin-bottom: 14px; box-shadow: 0 0 24px rgba(255,209,102,.08); }

const THEME_SRC = "assets/luxfatum-theme.mp3";
const audio = {
  ctx:null, music:false, sfx:true, timer:null, beat:0, track:null,
  ensure(){
    if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  ensureTheme(){
    if(!this.track){
      this.track = new Audio(THEME_SRC);
      this.track.loop = true;
      this.track.preload = "auto";
      this.track.volume = .62;
      this.track.load();
    }
    return this.track;
  },
  tone(freq, dur=.16, type="sine", vol=.08, when=0){
    const ctx = this.ensure(), now = ctx.currentTime + when;
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(vol, now + .015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.connect(gain).connect(ctx.destination); osc.start(now); osc.stop(now + dur + .03);
  },
  noise(dur=.12, vol=.08){
    if(!this.sfx) return;
    const ctx = this.ensure(), size = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<size;i++) data[i] = (Math.random() * 2 - 1) * (1 - i / size);
    const src = ctx.createBufferSource(), gain = ctx.createGain(), filter = ctx.createBiquadFilter();
    filter.type = "bandpass"; filter.frequency.value = 820;
    gain.gain.value = vol;
    src.buffer = buffer; src.connect(filter).connect(gain).connect(ctx.destination);
    src.start();
  },
  play(name){
    if(!this.sfx) return;
    const map = {
      ui:()=>this.tone(520,.07,"triangle",.035),
      pick:()=>{ this.tone(660,.1,"sine",.055); this.tone(990,.12,"sine",.035,.06); },
      hit:()=>{ this.noise(.13,.13); this.tone(110,.18,"sawtooth",.06); },
      skill:()=>{ this.tone(392,.11,"triangle",.055); this.tone(587,.14,"triangle",.05,.06); this.tone(880,.18,"sine",.04,.13); },
      heal:()=>{ this.tone(523,.12,"sine",.04); this.tone(659,.16,"sine",.045,.08); this.tone(784,.2,"sine",.035,.16); },
      guard:()=>{ this.tone(220,.12,"square",.045); this.tone(330,.16,"triangle",.04,.06); },
      ko:()=>{ this.tone(196,.18,"sawtooth",.07); this.tone(98,.34,"sawtooth",.05,.12); },
      win:()=>{ [523,659,784,1046].forEach((n,i)=>this.tone(n,.22,"triangle",.055,i*.09)); },
      rest:()=>this.tone(330,.18,"sine",.04)
    };
    (map[name] || map.ui)();
  },
  toggle(){
    this.music = !this.music;
    if(this.music) this.startMusic(); else this.stopMusic();
    render();
  },
  startMusic(){
    const track = this.ensureTheme();
    track.volume = .62;
    const playPromise = track.play();
    if(playPromise) playPromise.catch(() => {
      this.music = false;
      net.status = "再點一次即可播放主題曲";
      render();
    });
  },
  stopMusic(){
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
    if(this.track) this.track.pause();
  }
};

async function api(url, body){

  } catch(e) { return { ok:false, error:e.message }; }

async function sync(){
  if(net.mode !== "online") return;
  const res = await api("/api/state", { room:net.room, rev:net.rev, state });
  if(res.ok){ net.rev = res.rev; state = res.state; net.status = "已同步"; }
  else if(res.state){ net.rev = res.rev; state = res.state; net.status = "已拉回最新狀態"; }
  else { net.status = res.error || "同步失敗"; }
  render();
}
async function poll(){
  if(net.mode !== "online" || !net.polling) return;
  try {
    const res = await fetch(apiUrl(`/api/state?room=${encodeURIComponent(net.room)}`));
    const data = await res.json();
    if(data.ok && data.rev > net.rev){ net.rev = data.rev; state = data.state; render(); }
  } catch(e){ net.status = "同步中斷，稍後重試"; }
  pollTimer = setTimeout(poll, 800);
}
async function forceSync(){
  if(net.mode !== "online" || !net.room) return;

    if(data.ok){ net.rev = data.rev; state = data.state; net.status = "已重新同步"; }
    else net.status = data.error || "重新同步失敗";

}

function pick(id){
  audio.play("pick");
  if(state.screen !== "draft" || !canControl(state.draftTurn)) return;
  if(state.p1Draft.includes(id) || state.p2Draft.includes(id)) return;
  state[state.draftTurn + "Draft"].push(id);
  log(`${sideName(state.draftTurn)} 選擇 ${byId(id).name}。`);
  state.pickIndex += 1;
  if(state.pickIndex >= 6) startBattle();
  else state.draftTurn = draftSeq[state.pickIndex];
  commit();
}
function startBattle(){
  state.players = {
    p1:{ energy:2, marks:0, judgementUsed:false, resUsed:0, openingDefenseUsed:false, team:state.p1Draft.map(id=>fighter(id,"p1")) },
    p2:{ energy:2, marks:0, judgementUsed:false, resUsed:0, openingDefenseUsed:false, team:state.p2Draft.map(id=>fighter(id,"p2")) }
  };
  state.screen = "battle"; state.round = 0; nextRound();
}
function nextRound(){
  state.round += 1; state.lowestFirst = false; state.tianAtkBuff = false; state.tianSkillDebuff = false;
  for(const side of ["p1","p2"]){
    const p = state.players[side];
    p.energy = clamp(p.energy + 2, 0, 6); p.judgementUsed = false; p.resUsed = 0;
    if(state.round === 1) p.openingDefenseUsed = false;
    for(const c of alive(p.team)){
      c.cd = Math.max(0, c.cd - 1);
      c.statuses = c.statuses.filter(s => s !== STATUS.SLOW);
      Object.assign(c.flags, { defended:false, immuneNextDebuff:false, tookDamage:false, firstDamageReduced:false, noDefend:false,
        cannotAttackYingli:false, skillTargeted:false, atkMod:0, spdMod:0, damageTakenMod:0, hengshuoGuarded:false, hengshuoGuardUsed:false, hengshuoRedirectUsed:false });
      c.flags.huiyinUsed = false;
      if(c.flags.nextRoundAtkMod){ c.flags.atkMod += c.flags.nextRoundAtkMod; c.flags.nextRoundAtkMod = 0; }
      if(c.flags.nextRoundSpdMod){ c.flags.spdMod += c.flags.nextRoundSpdMod; c.flags.nextRoundSpdMod = 0; }
      if(c.flags.noAttack) c.flags.noAttack = false;
      if(c.id === "aila" && c.statuses.includes(STATUS.SEAL)){ c.statuses = c.statuses.filter(s=>s!==STATUS.SEAL); log("艾菈移除自身封印。"); }
    }
  }
  for(const side of ["p1","p2"]){
    const p = state.players[side];
    const deng = alive(p.team).find(c => c.id === "dengzhen" && c.cd === 0);
    if(deng){ p.energy = clamp(p.energy + 1, 0, 6); log(`${sideName(side)} 因燈真獲得1能量。`); }
    const tian = alive(p.team).find(c => c.id === "tianxun");
    if(tian){
      const targets = [...alive(p.team), ...alive(state.players[other(side)].team)];
      const target = targets[Math.floor(Math.random() * targets.length)];
      if(target){ target.flags.spdMod += 1; if(target.owner !== side) target.flags.damageTakenMod += 1; log(`天訊選中 ${target.name}：SPD+1${target.owner!==side ? "，受傷+1" : ""}。`); }
    }
  }

function buildQueue(){

  list.sort((a,b) => state.lowestFirst ? a.spd-b.spd || a.hp-b.hp || a.id.localeCompare(b.id) : b.spd-a.spd || a.hp-b.hp || a.id.localeCompare(b.id));

}
function afterAction(){

  else if(!p2) state.winner = "P1";
  if(state.winner){ audio.play("win"); commit(); return; }
  state.queue.shift();
  state.queue = state.queue.filter(q => state.players[q.side].team.find(c => c.id === q.id && c.hpNow > 0));
  if(!state.queue.length) endRound();

function endRound(){

    if(bai && p.team.some(c=>c.flags.tookDamage)){

function heal(target, amount, source){
  if(!target || target.hpNow <= 0) return;
  const before = target.hpNow; target.hpNow = clamp(target.hpNow + amount, 0, target.maxHp);
  log(`${source}：${target.name} 回復 ${target.hpNow - before} HP。`);
  if(target.hpNow > before){ setFx("heal", source, `${target.name} +${target.hpNow - before} HP`); audio.play("heal"); }
}
function removeNeg(target){
  const s = target.statuses.find(x => NEG.includes(x));

}
function addStatus(source, target, status){
  if(!target || target.hpNow <= 0) return;

  if(NEG.includes(status)){
    const hui = alive(state.players[target.owner].team).find(c => c.id === "huiyin" && c.id !== target.id && !c.flags.huiyinUsed);
    if(hui){ hui.flags.huiyinUsed = true; target = hui; log("迴音將負面狀態轉移給自己。"); }
  }
  if(NEG.includes(status) && target.flags.immuneNextDebuff){ target.flags.immuneNextDebuff = false; log(`${target.name} 免疫 ${status}。`); return; }
  if(!target.statuses.includes(status)){ target.statuses.push(status); log(`${source}給予 ${target.name} ${status}。`); setFx("status", source, `${target.name} 獲得 ${status}`); }
}
function redirectTarget(target, dmg){
  const team = state.players[target.owner].team;
  const guard = team.find(c => c.id !== target.id && c.hpNow > 0 && c.statuses.includes(STATUS.GUARD));
  if(guard && dmg > 0){ guard.statuses = guard.statuses.filter(s=>s!==STATUS.GUARD); log(`${guard.name} 以守護代替 ${target.name} 承受傷害。`); return guard; }
  const heng = team.find(c => c.id === "hengshuo" && c.id !== target.id && c.hpNow > 0 && !c.flags.hengshuoRedirectUsed);
  if(heng && dmg > 0){ heng.flags.hengshuoRedirectUsed = true; log(`衡朔代替 ${target.name} 承受傷害。`); return heng; }
  return target;
}
function damage(source, target, amount, opts={}){
  if(!target || target.hpNow <= 0) return 0;
  let dmg = amount; const owner = target.owner; const label = opts.label || source?.name || "效果";
  if(target.statuses.includes(STATUS.OBSERVE) && target.id !== "yingli"){ dmg += 1; target.statuses = target.statuses.filter(s=>s!==STATUS.OBSERVE); log(`${target.name} 觀測觸發，傷害+1。`); }
  dmg += target.flags.damageTakenMod || 0;
  if(target.flags.hengshuoGuarded && !target.flags.hengshuoGuardUsed){ target.flags.hengshuoGuardUsed = true; const h = state.players[owner].team.find(c=>c.id==="hengshuo"&&c.hpNow>0); if(h) heal(h,1,"衡朔近身護衛"); }
  if(opts.skill && state.tianSkillDebuff) dmg -= 1;
  if(target.id === "youming" && !target.flags.firstDamageReduced){ target.flags.firstDamageReduced = true; dmg -= 1; log("幽冥第一次受傷-1。"); }
  if(opts.skill && target.id === "aila" && !target.statuses.some(s=>NEG.includes(s))) dmg -= 1;
  if(opts.skill && target.id === "yingli" && !target.flags.skillTargeted){ target.flags.skillTargeted = true; dmg -= 2; }
  const wei = alive(state.players[owner].team).find(c=>c.id==="weixiang");
  if(wei && amount >= 3 && !wei.flags.firstDamageReduced){ wei.flags.firstDamageReduced = true; dmg -= 1; log("未響使首次3以上傷害-1。"); }
  if(target.flags.defended) dmg -= 2;
  dmg = Math.max(1, dmg);
  const actual = redirectTarget(target, dmg);
  const p = state.players[actual.owner];
  if(state.round === 1 && !p.openingDefenseUsed){ p.openingDefenseUsed = true; dmg = Math.max(1, dmg - 1); log("開局防線：首次受傷-1。"); }
  if(source?.flags?.confuseDamageCap && actual.owner === source.owner) dmg = Math.min(dmg, 1);
  const before = actual.hpNow; actual.hpNow = Math.max(0, actual.hpNow - dmg); actual.flags.tookDamage = true;
  state.lastHit = { owner:actual.owner, id:actual.id, stamp:Date.now() };
  state.shakeStamp = Date.now();
  log(`${label} 對 ${actual.name} 造成 ${before - actual.hpNow} 傷害。`);
  if(before > actual.hpNow){ setFx(opts.skill ? "skill" : "damage", label, `${actual.name} -${before - actual.hpNow} HP`); audio.play("hit"); }
  if(actual.hpNow <= 0) knockout(actual, source);
  return before - actual.hpNow;
}
function knockout(c, source){

  if(c.id === "baidengling" && !c.flags.passiveUsed){ c.flags.passiveUsed = true; c.flags.noAttack = true; c.hpNow = 1; log("白燈澪保留1HP，下回合不能攻擊。"); return; }
  if(c.id === "xiaomo" && !c.flags.passiveUsed){ c.flags.passiveUsed = true; if(coin()){ c.hpNow = 1; log("小莫硬幣正面，保留1HP。"); return; } p.marks = clamp(p.marks+1,0,3); log("小莫反面，獲得1裁定。"); }
  if(c.id === "zuozhe" && !c.flags.passiveUsed){
    c.flags.passiveUsed = true; const enemies = alive(state.players[other(c.owner)].team); const min = Math.min(...enemies.map(e=>e.hpNow));
    for(const e of enemies) damage(c, e, e.hpNow === min ? 2 : 1, { label:"作者自爆" });

  if(source?.id === "zuozhe" && source.owner !== c.owner){ state.players[source.owner].marks = clamp(state.players[source.owner].marks+1,0,3); log("作者自爆擊倒敵方，獲得1裁定。"); }
}

function requestAttack(){
  audio.play("ui");
  const actor = activeF(); if(!actor || !canControl(actor.owner) || actor.flags.noAttack || state.pendingConfuseAttack) return;
  if(actor.statuses.includes(STATUS.CONFUSE)){
    state.pendingConfuseAttack = { actorSide:actor.owner, actorId:actor.id, action:"attack" };
    log(`${actor.name} 因混亂，攻擊目標改由對方指定。`);

  }

}
function performAttack(actor, target, confused=false){
  if(!actor || !target || actor.flags.noAttack) return false;
  if(actor.flags.cannotAttackYingli && target.id === "yingli"){ alert("不能指定映璃"); return false; }
  if(confused || actor.statuses.includes(STATUS.CONFUSE)){
    actor.statuses = actor.statuses.filter(s=>s!==STATUS.CONFUSE);
    log(`${actor.name} 混亂發作，攻擊了 ${target.name}。`);
  }
  actor.flags.confuseDamageCap = !!(confused && target.owner === actor.owner);
  let dmg = currentAtk(actor);
  if(actor.id === "leiting" && target.hpNow > actor.hpNow) dmg += 1;
  if(actor.id === "xuntian" && (target.statuses.includes(STATUS.SEAL) || target.statuses.includes(STATUS.CONFUSE))) dmg += 1;
  if(actor.flags.buffDmgNext){ dmg += actor.flags.buffDmgNext; actor.flags.buffDmgNext = 0; }
  if(state.tianAtkBuff) dmg += 1;
  damage(actor, target, dmg, { label:`${actor.name}普攻` });
  actor.flags.confuseDamageCap = false;
  return true;
}
function attack(targetKey){
  const actor = activeF(); if(!actor || !canControl(actor.owner)) return;

}
function decideConfuseAttack(targetKey){

  if(pending.action === "skill"){
    executeSkill(targetKey, {...pending.opts, actorId:pending.actorId, confuseTargetChosen:true});

  clearSeal(actor); closeDialog(); afterAction();
}

function skillCost(actor, res){ let cost = actor.skill.cost + (actor.flags.skillCostUp || 0); if(res && actor.skill.cost === 1) cost += 1; if(res && actor.id === "huiyin") cost -= 1; return Math.max(0,cost); }

function useSkill(targetKey, opts={}){

  if(actor.flags.noResNextSkill && res){ actor.flags.noResNextSkill = false; res = false; log("裁定封殺：本次技能不能共鳴。"); }
  opts = {...opts, res};
  if(!tianChoicesOk(actor, res, opts.choices || [])) return;
  if(actor.statuses.includes(STATUS.CONFUSE) && skillFilter(actor) !== "none" && !opts.confuseTargetChosen){
    state.pendingConfuseAttack = { actorSide:actor.owner, actorId:actor.id, action:"skill", opts };

function decideIno(useInterference){
  const pending = state.pendingSkill;
  if(!pending || !canControl(other(pending.actorSide))) return;
  state.pendingSkill = null;

function executeSkill(targetKey, opts={}){
  const actor = activeF(); if(!actor || actor.id !== opts.actorId && opts.actorId) return;
  const p = state.players[actor.owner]; let res = !!opts.res;
  let cost = skillCost(actor, res);
  const enemyIno = enemyInoFor(actor);
  let inoApplied = false;
  if(opts.inoDecision && enemyIno){ cost += 1; enemyIno.flags.inoUsed += 1; inoApplied = true; log(`伊諾選擇干涉：${actor.name} 技能費用 +1。`); }
  else if(enemyIno){ log("伊諾選擇不干涉。"); }
  if(p.energy < cost){
    log(`${actor.name} 因能量不足，技能發動失敗。`);
    closeDialog(); afterAction(); return;
  }
  const target = parseTarget(targetKey);
  const confusedSkill = !!opts.confuseTargetChosen && target;
  if(confusedSkill){
    actor.statuses = actor.statuses.filter(s=>s!==STATUS.CONFUSE);
    actor.flags.confuseDamageCap = target.owner === actor.owner;
    log(`${actor.name} 混亂發作，技能指定了 ${target.name}。`);
  }
  p.energy -= cost; actor.cd = actor.skill.cd; actor.flags.skillCostUp = 0; if(res) p.resUsed += 1;
  const ok = resolveSkill(actor, target, res, opts);
  actor.flags.confuseDamageCap = false;
  if(!ok){
    p.energy = clamp(p.energy + cost, 0, 6);
    actor.cd = 0;
    if(res) p.resUsed = Math.max(0, p.resUsed - 1);
    if(inoApplied) enemyIno.flags.inoUsed = Math.max(0, enemyIno.flags.inoUsed - 1);
    log(`${actor.name} 技能目標或條件不合法，未消耗行動。`);
    closeDialog(); commit(); return;
  }
  if(ok && opts.inoDecision && enemyIno){ state.players[enemyIno.owner].energy = clamp(state.players[enemyIno.owner].energy+1,0,6); log("伊諾干涉成功後獲得1能量。"); }
  if(ok){ for(const side of ["p1","p2"]){ const y = alive(state.players[side].team).find(c=>c.id==="yiaiqian"); if(y) y.flags.records = clamp((y.flags.records||0)+1,0,3); } }
  closeDialog(); afterAction();
}

    case "hengshuo": if(!t||t.owner!==a.owner)return false; t.flags.damageTakenMod-=2; t.flags.hengshuoGuarded=true; t.statuses=t.statuses.filter(s=>s!==STATUS.OBSERVE); if(res)addStatus(a.res.name,t,STATUS.GUARD); break;

    case "baijian": if(!t||t.owner!==a.owner)return false; { const min=Math.min(...alive(state.players[a.owner].team).map(c=>c.hpNow)); heal(t,t.hpNow===min?4:3,name); removeNeg(t); } if(res)addStatus(a.res.name,t,STATUS.GUARD); record={kind:"heal",amount:3}; break;

    case "aila": addStatus(name,t,STATUS.SEAL); if(t.statuses.includes(STATUS.OBSERVE)){ damage(a,t,2,{skill:true,label:name}); record={kind:"damage",amount:2}; } if(res)state.players[a.owner].energy=clamp(state.players[a.owner].energy+1,0,6); break;

    case "baidengling": for(const ally of alive(state.players[a.owner].team))heal(ally,1,name); { const low=alive(state.players[a.owner].team).sort((x,y)=>x.hpNow-y.hpNow)[0]; if(low)heal(low,1,"希望微光"); if(res&&low)removeNeg(low); } if(trailing(a.owner))state.players[a.owner].marks=clamp(state.players[a.owner].marks+1,0,3); record={kind:"heal",amount:1}; break;
    case "yiaiqian": if(!state.lastSkill || (a.flags.records||0)<1)return false; a.flags.records-=1; if(state.lastSkill.kind==="damage")damage(a,t,state.lastSkill.amount,{skill:true,label:name}); else heal(t,state.lastSkill.amount,name); if(res)state.players[a.owner].energy=clamp(state.players[a.owner].energy+1,0,6); break;
    case "weixiang": if(!t||t.owner!==a.owner)return false; addStatus(name,t,STATUS.GUARD); heal(t,1,name); if(res)t.flags.damageTakenMod-=1; record={kind:"heal",amount:1}; break;
    case "xiaomo": { const heads=coin(); if(heads){ damage(a,t,4,{skill:true,label:name}); record={kind:"damage",amount:4}; } else { addStatus(name,t,STATUS.CONFUSE); damage(a,a,1,{skill:true,label:"小莫反噬"}); if(res)addStatus(a.res.name,t,STATUS.SLOW); } break; }

    case "tianxun": { const choices=opts.choices||[]; const selected=choices.slice(0,res?2:1); if(!selected.length)return false; for(const ch of selected){ if(ch==="atk")state.tianAtkBuff=true; if(ch==="skill")state.tianSkillDebuff=true; if(ch==="spd")for(const ally of alive(state.players[a.owner].team))ally.flags.spdMod+=1; if(ch==="low")state.lowestFirst=true; } if(res)a.flags.noDefend=true; log(`${name}套用 ${selected.join("、")}。`); break; }

}
function judgement(type,targetKey){

  p.marks-=cost; p.judgementUsed=true;
  if(type==="atk"){ actor.flags.atkMod+=1; log("裁定：本次/本回合傷害+1。"); }
  if(type==="def"){ actor.flags.damageTakenMod-=1; log("裁定：受傷-1。"); }
  if(type==="spd"){ t.flags.spdMod+=1; log(`裁定：${t.name} SPD+1。`); }
  if(type==="heal"){ t.cd=Math.max(0,t.cd-1); heal(t,1,"裁定"); }
  if(type==="seal"){ t.flags.noResNextSkill=true; addStatus("裁定封殺",t,STATUS.SLOW); }
  closeDialog(); commit();
}

async function toggleFullscreen(){
  audio.play("ui");

  ui.fullscreen = next;
  try{
    if(next && !document.fullscreenElement) await document.documentElement.requestFullscreen();
    else if(!next && document.fullscreenElement) await document.exitFullscreen();
  }catch(err){
    net.status = next ? "已切換遊戲滿版模式；瀏覽器若允許會同步進入全螢幕。" : "已退出遊戲滿版模式。";

function targetList(filter){
  const actor=activeF(); const out=[];
  for(const side of ["p1","p2"]) for(const c of alive(state.players[side].team)){
    if(filter==="ally" && side!==actor.owner)continue; if(filter==="enemy" && side===actor.owner)continue;
    out.push({key:`${side}:${c.id}`, side, c});
  }
  return out;
}
function skillFilter(actor){
  if(["hengshuo","baijian","weixiang"].includes(actor.id))return"ally";
  if(actor.id==="zuozhe")return"enemy";
  if(["dengzhen","yiaiqian","huiyin"].includes(actor.id))return"all";
  if(["baidengling","tianxun"].includes(actor.id))return"none";
  return"enemy";
}
function confusionTargets(actor){
  const out = [];
  for(const side of ["p1","p2"]) for(const c of alive(state.players[side].team)){
    const blocked = actor?.flags.cannotAttackYingli && c.id === "yingli";
    if(!blocked) out.push({key:`${side}:${c.id}`, side, c});
  }
  return out;
}

    <button onclick="requestAttack()" ${!own||a.flags.noAttack?"disabled":""}><span class="command-label">攻擊</span><span class="command-note">指定敵方，造成 ATK ${currentAtk(a)} 傷害</span></button>
    <button onclick="openDialog('skill')" ${!own||!canSkill?"disabled":""}><span class="command-label">技能</span><span class="command-note">${a.skill.name}｜${skillHint}</span></button>
    <button onclick="defend()" ${!own||a.flags.noDefend?"disabled":""}><span class="command-label">防禦</span><span class="command-note">本次受傷 -2，並免疫下一個負面狀態</span></button>
    <button onclick="rest()" ${!own?"disabled":""}><span class="command-label">休息</span><span class="command-note">回復 1 HP，移除 1 個負面狀態</span></button>
    <button class="judgement-action" onclick="openDialog('judgement')" ${!own||p.judgementUsed||p.marks<1?"disabled":""}><span class="command-label">裁定</span><span class="command-note">目前 ${p.marks}/3，可補傷害、提速或救場</span></button>
  </div></section>`;
}
function renderStatusHelp(c){
  const rows = c.statuses.map(s => {
    const meta = STATUS_META[s] || { desc:s };
    return `<div class="status-help-row"><b>${s}</b><span>${meta.desc}</span></div>`;
  });
  if(c.flags.defended) rows.unshift(`<div class="status-help-row"><b>防禦</b><span>本回合受傷 -2，並免疫下一個負面狀態。</span></div>`);
  if(c.flags.noAttack) rows.unshift(`<div class="status-help-row"><b>禁攻</b><span>本次行動不能攻擊。</span></div>`);
  return rows.length ? `<div class="status-help">${rows.join("")}</div>` : "";
}
function renderSurrenderPanel(){
  if(net.mode === "online"){
    return `<details class="danger-zone"><summary>對戰控制</summary><div class="action-grid"><button class="bad" onclick="surrender('${net.seat}')" ${!net.seat ? "disabled" : ""}>${net.seat.toUpperCase()} 投降</button></div></details>`;
  }
  const activeSide = state.active?.side || "p1";
  return `<details class="danger-zone"><summary>對戰控制</summary><div class="action-grid"><button class="bad" onclick="surrender('${activeSide}')">當前方 ${sideName(activeSide)} 投降</button><button class="bad" onclick="surrender('${other(activeSide)}')">另一方 ${sideName(other(activeSide))} 投降</button></div></details>`;
}
function renderPendingIno(){
  const pending = state.pendingSkill;
  if(!pending) return "";
  const actor = state.players[pending.actorSide]?.team.find(c=>c.id===pending.actorId);
  const defender = other(pending.actorSide);
  const ino = alive(state.players[defender].team).find(c=>c.id==="ino");
  const canDecide = canControl(defender);
  return `<section class="actions pending">
    <h2>伊諾干涉判定</h2>
    <p>${sideName(pending.actorSide)} 的 ${actor?.name || "角色"} 正要施放技能。</p>
    <p class="desc">伊諾可使該技能費用 +1；若技能仍成功結算，伊諾方獲得 1 能量。</p>
    ${canDecide ? `<div class="action-grid"><button onclick="decideIno(true)">干涉：費用 +1</button><button onclick="decideIno(false)">不干涉</button></div>` : `<p class="notice">等待 ${sideName(defender)} 操作 ${ino?.name || "伊諾"}。</p>`}
  </section>`;
}
function renderPendingConfuse(){
  const pending = state.pendingConfuseAttack;
  if(!pending) return "";
  const actor = state.players[pending.actorSide]?.team.find(c=>c.id===pending.actorId);
  const defender = other(pending.actorSide);
  const canDecide = canControl(defender);
  const targets = confusionTargets(actor);
  const actionName = pending.action === "skill" ? "技能" : "攻擊";
  return `<section class="actions pending">
    <h2>混亂攻擊目標</h2>
    <p>${actor?.name || "角色"} 的${actionName}由 ${sideName(defender)} 指定目標。</p>
    <p class="desc">若指定到原使用者的我方角色，該次傷害最多為 1。</p>
    ${canDecide ? `<div class="choice-grid">${targets.map(t=>`<button class="choice" onclick="decideConfuseAttack('${t.key}')">${sideName(t.side)} ${t.c.name}<br><span class="pill">HP ${t.c.hpNow}/${t.c.maxHp}</span></button>`).join("")}</div>` : `<p class="notice">等待 ${sideName(defender)} 選擇攻擊目標。</p>`}
  </section>`;
}
function renderLog(){
  return `<section class="log"><h2>戰鬥紀錄</h2>${state.logs.slice().reverse().map(x=>`<div class="log-line ${/造成|擊倒|混亂發作/.test(x) ? "impact" : ""}">${x}</div>`).join("")}</section>`;
}
function renderDialog(){
  if(!dialog)return""; const a=activeF(); if(!a)return"";
  if(dialog==="attack"){
    const filter=a.statuses.includes(STATUS.CONFUSE)?"all":"enemy";
    return modal("選擇攻擊目標", `<div class="choice-grid">${targetList(filter).map(t=>`<button class="choice" onclick="attack('${t.key}')">${sideName(t.side)} ${t.c.name}<br><span class="pill">HP ${t.c.hpNow}/${t.c.maxHp}</span></button>`).join("")}</div>`);
  }
  if(dialog==="skill"){
    const filter=skillFilter(a); const resDisabled=state.players[a.owner].resUsed>=2 || !alive(state.players[a.owner].team).some(c=>c.id!==a.id);
    const resCost = skillCost(a, true);
    const resReason = resDisabled
      ? (state.players[a.owner].resUsed>=2 ? "本回合共鳴次數已達上限。" : "需要至少1名其他我方角色存活。")
      : `勾選後技能總費用：${resCost} 能量。`;
    const common = `<div class="dialog-section">
      <h3>技能資訊</h3>
      <div class="skill-meta"><span class="pill">消耗 ${skillCost(a,false)} 能量</span><span class="pill">冷卻 ${a.skill.cd}</span><span class="pill">目前能量 ${state.players[a.owner].energy}/6</span></div>
    </div>
    <div class="dialog-section resonance-box">
      <h3>共鳴</h3>
      <label class="row"><input id="resBox" type="checkbox" ${resDisabled?"disabled":""} style="width:auto"> 使用共鳴：${a.res.name}</label>
      <p class="skill-desc"><b>${a.res.name}</b>：${a.res.desc}</p>
      <p class="desc">${resReason}</p>
    </div>`;
    const resExpr = "document.querySelector('#resBox').checked";
    if(a.id==="tianxun")return modal(a.skill.name, `${common}<div class="dialog-section"><h3>效果</h3><p class="skill-desc">未使用共鳴最多選 1 項；使用共鳴最多選 2 項。</p></div><div class="dialog-section"><h3>選擇效果</h3><div class="choice-grid">${["atk:普攻傷害+1","skill:技能傷害-1","spd:我方全體SPD+1","low:最低SPD先行動"].map(s=>{const [v,l]=s.split(":");return`<label class="choice"><input name="tian" value="${v}" type="checkbox"> <span class="choice-title">${l}</span></label>`}).join("")}</div></div><button onclick="useSkill(null,{res:${resExpr},choices:[...document.querySelectorAll('input[name=tian]:checked')].map(i=>i.value)})">施放</button>`);
    if(a.id==="baidengling")return modal(a.skill.name, `${common}<div class="dialog-section"><h3>效果</h3><p class="skill-desc">${a.skill.desc}</p></div><button onclick="useSkill(null,{res:${resExpr}})">施放希望微光</button>`);
    if(a.id==="dengzhen")return modal(a.skill.name, `${common}<div class="dialog-section"><h3>效果</h3><p class="skill-desc">${a.skill.desc}</p></div><div class="dialog-section"><h3>選擇目標</h3><div class="choice-grid">${targetList("all").map(t=>`<div class="choice"><span class="choice-title">${sideName(t.side)} ${t.c.name}</span><span class="pill">HP ${t.c.hpNow}/${t.c.maxHp}</span><div class="row" style="margin-top:12px"><button onclick="useSkill('${t.key}',{mode:'up',res:${resExpr}})">SPD +2</button><button onclick="useSkill('${t.key}',{mode:'down',res:${resExpr}})">SPD -2</button></div></div>`).join("")}</div></div>`);
    return modal(a.skill.name, `${common}<div class="dialog-section"><h3>效果</h3><p class="skill-desc">${a.skill.desc}</p></div><div class="dialog-section"><h3>選擇目標</h3><div class="choice-grid">${targetList(filter).map(t=>`<button class="choice" onclick="useSkill('${t.key}',{res:${resExpr}})"><span class="choice-title">${sideName(t.side)} ${t.c.name}</span><span class="pill">HP ${t.c.hpNow}/${t.c.maxHp}</span></button>`).join("") || "<p>不需目標</p>"}</div></div>`);
  }
  if(dialog==="judgement"){
    return modal("裁定", `<div class="choice-grid"><button onclick="judgement('atk')">1 裁定：傷害+1</button><button onclick="judgement('def')">1 裁定：受傷-1</button>${targetList("ally").map(t=>`<button onclick="judgement('spd','${t.key}')">1 裁定：${t.c.name} SPD+1</button><button onclick="judgement('heal','${t.key}')">2 裁定：${t.c.name} 冷卻-1並回1HP</button>`).join("")}${targetList("enemy").map(t=>`<button onclick="judgement('seal','${t.key}')">3 裁定：封殺 ${t.c.name} 共鳴並遲緩</button>`).join("")}</div>`);
  }
  return"";
}
function modal(title, body){ return `<div class="modal" onclick="if(event.target===this)closeDialog()"><section class="dialog"><div class="row dialog-head"><h2>${title}</h2><button onclick="closeDialog()">關閉</button></div><div class="dialog-body">${body}</div></section></div>`; }
document.addEventListener("fullscreenchange", () => {
  ui.fullscreen = !!document.fullscreenElement;
  render();
});
render();
</script>
</body>
</html>
